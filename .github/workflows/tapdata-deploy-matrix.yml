# TapData Deploy (Matrix) —— worker 端可复用 workflow，隐藏"自动跳过"的部署步骤
# ============================================================================
# 与 tapdata-deploy.yml 并存，不改动原文件，不影响现有 deploy 流程。
#
# 与原版的唯一核心差异：
#   原版：connections / FDM / MDM / APIs 各自是独立 deploy job，用 preview 的
#         has_changes + if: 判断是否运行。无变更的资源 job 被 skip，但仍以灰色
#         "已跳过"出现在运行图里，容易让人误解。
#   本版：preview-all 之后构建"只含有变更资源"的动态 matrix，单个 deploy job 用
#         strategy.matrix 展开。无变更的资源根本不会生成 matrix 腿 → 运行图里
#         看不到它，不再显示灰色"已跳过"。
#
# 代价（已确认接受）：4 个资源合并为 1 个 deploy job → 部署前人工审批从最多 4 次
#   合并为 1 次。全部资源都无变更时会有 1 个 "Deploy (已跳过)" 灰节点（表示无需
#   部署），这是 GitHub Actions 机制下无法消除的，但与"部分跳过"的混乱不同。
#
# 触发方式：仅 workflow_call（多租户）。实际运行 actions 的是租户仓库，由租户的
#   caller workflow（tenant-template/.github/workflows/tapdata-deploy-matrix.yml）
#   通过 uses: 调用本文件。worker 仓库自身不会触发它，零干扰。
# ============================================================================
name: TapData Deploy (Matrix)

on:
  # 多租户模式：被租户仓库通过 workflow_call 调用
  workflow_call:
    inputs:
      project:
        description: 'Project name (租户仓库中 {project}_tapdata_export/ 目录的前缀)'
        required: true
        type: string
      target_env:
        description: 'Target environment (workflow_dispatch 手动触发时由租户传入；push/tag 时留空，由 caller_event/caller_ref 自动推导)'
        required: false
        type: string
        default: ''
      caller_repo:
        description: 'Caller tenant repo full name, e.g. your-org/your-tenant-repo'
        required: true
        type: string
      caller_sha:
        description: '租户仓库的 commit SHA，用于精确 checkout'
        required: true
        type: string
      caller_event:
        description: '租户仓库的原始事件名（push/workflow_dispatch），用于推导 TARGET_ENV'
        required: true
        type: string
      caller_ref:
        description: '租户仓库的原始 ref（refs/heads/main 或 refs/tags/xxx），用于判断是否为 tag'
        required: true
        type: string
      worker_repo:
        description: 'Worker repo full name, e.g. your-org/tapdata-cicd-worker (used to checkout worker scripts)'
        required: true
        type: string
    secrets:
      GH_DEPLOY_TOKEN:
        required: true

env:
  DEPLOY_DIR: /tmp/tapdata-deploy-${{ github.run_id }}
  # 多租户模式：workflow_call 时使用租户的 caller_sha
  DEPLOY_REF: ${{ inputs.caller_repo != '' && inputs.caller_sha || github.ref_name }}
  # TARGET_ENV 推导逻辑：
  #   workflow_call + target_env 已传入 → 使用 inputs.target_env
  #   workflow_call + caller_event=push + 非 tag ref → dev
  #   workflow_call + caller_event=push + tag ref → sit
  TARGET_ENV: >-
    ${{
      (inputs.caller_repo != '' && inputs.target_env != '') && inputs.target_env
      || (inputs.caller_repo != '' && inputs.caller_event == 'push' && !startsWith(inputs.caller_ref, 'refs/tags/')) && 'dev'
      || (inputs.caller_repo != '' && inputs.caller_event == 'push' && startsWith(inputs.caller_ref, 'refs/tags/')) && 'sit'
      || inputs.target_env
    }}

jobs:
  # ============================================================
  # Job 1: Preparation Phase
  # ============================================================
  preparation:
    name: Preparation Phase
    runs-on: [self-hosted, tapdata]
    timeout-minutes: 5
    environment: >-
      ${{
        (inputs.caller_repo != '' && inputs.target_env != '') && inputs.target_env
        || (inputs.caller_repo != '' && inputs.caller_event == 'push' && !startsWith(inputs.caller_ref, 'refs/tags/')) && 'dev'
        || (inputs.caller_repo != '' && inputs.caller_event == 'push' && startsWith(inputs.caller_ref, 'refs/tags/')) && 'sit'
        || inputs.target_env
      }}
    outputs:
      tapdata_token: ${{ steps.get_token.outputs.tapdata_token }}
      target_env: ${{ env.TARGET_ENV }}
      tapdata_url: ${{ steps.resolve_config.outputs.tapdata_url }}
      project: ${{ steps.detect_project.outputs.project }}
      vault_transport: ${{ steps.resolve_transport.outputs.vault_transport }}
      prep_runner: ${{ steps.resolve_transport.outputs.prep_runner }}
    steps:
      # Step 1: checkout 租户仓库（含 JSON 文件）到 workspace 根
      - name: Checkout Data Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.caller_repo != '' && inputs.caller_repo || github.repository }}
          ref: ${{ inputs.caller_repo != '' && inputs.caller_sha || env.DEPLOY_REF }}
          token: ${{ secrets.GH_DEPLOY_TOKEN }}
          fetch-depth: 2

      # Step 2: 设置 SCRIPT_ROOT、REPO_ROOT 和 WORKER_REPO
      - name: Set Runtime Paths
        run: |
          if [[ -n "${{ inputs.caller_repo }}" ]]; then
            echo "WORKER_REPO=${{ inputs.worker_repo }}" >> "$GITHUB_ENV"
            echo "SCRIPT_ROOT=_worker" >> "$GITHUB_ENV"
            echo "REPO_ROOT=${{ github.workspace }}" >> "$GITHUB_ENV"
          else
            echo "SCRIPT_ROOT=." >> "$GITHUB_ENV"
            echo "REPO_ROOT=$(pwd)" >> "$GITHUB_ENV"
          fi

      # Step 3: 仅 workflow_call 时，额外 checkout worker scripts 到 _worker/
      - name: Checkout Worker Scripts
        if: inputs.caller_repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WORKER_REPO }}
          ref: main
          token: ${{ secrets.GH_DEPLOY_TOKEN }}
          path: _worker

      - name: Detect Project
        id: detect_project
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/tapdata-deploy/detect-project.sh
        env:
          # workflow_call 时：project 由租户程序化传入，直接使用；
          # 单仓库 push / 手动 dispatch 时 INPUT_PROJECT 为空 → detect-project.sh 自动检测（一仓一项目）
          INPUT_PROJECT: ${{ inputs.project }}
          PROJECT_NAME:  ${{ vars.PROJECT_NAME }}

      - name: Check tapdata_export Directory
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/check-export-dir.sh
        env:
          EXPORT_DIR: ${{ env.REPO_ROOT }}/${{ env.PROJECT }}_tapdata_export

      - name: Validate Input Parameters
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/tapdata-deploy/validate-inputs.sh
        env:
          REPO_ROOT: ${{ env.REPO_ROOT }}
          DEPLOYMENT_REF: ${{ env.DEPLOY_REF }}
          TARGET_ENV: ${{ env.TARGET_ENV }}
          PROJECT: ${{ env.PROJECT }}

      - name: Resolve TapData Connection Config
        id: resolve_config
        run: |
          case "${TARGET_ENV}" in
            dev)  URL="${DEV_TAPDATA_URL:-${TAPDATA_URL}}"  ; CODE="${DEV_TAPDATA_ACCESS_CODE:-${TAPDATA_ACCESS_CODE}}" ;;
            sit)  URL="${SIT_TAPDATA_URL:-${TAPDATA_URL}}"  ; CODE="${SIT_TAPDATA_ACCESS_CODE:-${TAPDATA_ACCESS_CODE}}" ;;
            lpt)  URL="${LPT_TAPDATA_URL:-${TAPDATA_URL}}"  ; CODE="${LPT_TAPDATA_ACCESS_CODE:-${TAPDATA_ACCESS_CODE}}" ;;
            aat)  URL="${AAT_TAPDATA_URL:-${TAPDATA_URL}}"  ; CODE="${AAT_TAPDATA_ACCESS_CODE:-${TAPDATA_ACCESS_CODE}}" ;;
            prod) URL="${PROD_TAPDATA_URL:-${TAPDATA_URL}}" ; CODE="${PROD_TAPDATA_ACCESS_CODE:-${TAPDATA_ACCESS_CODE}}" ;;
            *)    URL="${TAPDATA_URL}" ; CODE="${TAPDATA_ACCESS_CODE}" ;;
          esac
          echo "tapdata_url=${URL}" >> "${GITHUB_OUTPUT}"
          echo "::add-mask::${CODE}"
          echo "tapdata_accesscode=${CODE}" >> "${GITHUB_OUTPUT}"
        env:
          TARGET_ENV: ${{ env.TARGET_ENV }}
          TAPDATA_URL:              ${{ vars.TAPDATA_URL }}
          DEV_TAPDATA_URL:          ${{ vars.DEV_TAPDATA_URL }}
          SIT_TAPDATA_URL:          ${{ vars.SIT_TAPDATA_URL }}
          LPT_TAPDATA_URL:          ${{ vars.LPT_TAPDATA_URL }}
          AAT_TAPDATA_URL:          ${{ vars.AAT_TAPDATA_URL }}
          PROD_TAPDATA_URL:         ${{ vars.PROD_TAPDATA_URL }}
          TAPDATA_ACCESS_CODE:      ${{ secrets.TAPDATA_ACCESS_CODE }}
          DEV_TAPDATA_ACCESS_CODE:  ${{ secrets.DEV_TAPDATA_ACCESS_CODE }}
          SIT_TAPDATA_ACCESS_CODE:  ${{ secrets.SIT_TAPDATA_ACCESS_CODE }}
          LPT_TAPDATA_ACCESS_CODE:  ${{ secrets.LPT_TAPDATA_ACCESS_CODE }}
          AAT_TAPDATA_ACCESS_CODE:  ${{ secrets.AAT_TAPDATA_ACCESS_CODE }}
          PROD_TAPDATA_ACCESS_CODE: ${{ secrets.PROD_TAPDATA_ACCESS_CODE }}

      - name: Get TapData Token
        id: get_token
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/get-token.sh
        env:
          TARGET_ENV: ${{ env.TARGET_ENV }}
          TAPDATA_URL: ${{ steps.resolve_config.outputs.tapdata_url }}
          TAPDATA_ACCESSCODE: ${{ steps.resolve_config.outputs.tapdata_accesscode }}

      - name: Generate vault.json with Connection Secrets
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/tapdata-deploy/generate-vault.sh
        env:
          REPO_ROOT: ${{ env.REPO_ROOT }}
          PROJECT: ${{ env.PROJECT }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}

      - name: Encrypt vault.json
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/vault-crypto.sh
        env:
          VAULT_FILE: ${{ env.PROJECT }}_tapdata_export/vault.json
          VAULT_ENCRYPTION_KEY: ${{ secrets.VAULT_ENCRYPTION_KEY }}
          CRYPTO_ACTION: encrypt

      - name: Upload vault (artifact v4)
        id: upload_vault_v4
        if: vars.VAULT_TRANSPORT != 'local'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vault-and-export
          path: |
            ${{ env.PROJECT }}_tapdata_export/vault.json
          retention-days: 1

      - name: Resolve vault transport
        id: resolve_transport
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/resolve-vault-transport.sh
        env:
          FORCED_TRANSPORT: ${{ vars.VAULT_TRANSPORT }}
          UPLOAD_V4_OUTCOME: ${{ steps.upload_vault_v4.outcome }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          VAULT_FILE: ${{ env.PROJECT }}_tapdata_export/vault.json
          RUNNER_NAME: ${{ runner.name }}

  # ============================================================
  # Job 2: Deploy Users (no approval required)
  # ============================================================
  deploy-users:
    name: Deploy Users
    runs-on: [self-hosted, tapdata]
    timeout-minutes: 15
    needs: [preparation]
    env:
      PROJECT: ${{ needs.preparation.outputs.project }}
    steps:
      - name: Checkout Data Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.caller_repo != '' && inputs.caller_repo || github.repository }}
          ref: ${{ inputs.caller_repo != '' && inputs.caller_sha || env.DEPLOY_REF }}
          token: ${{ secrets.GH_DEPLOY_TOKEN }}

      - name: Set Runtime Paths
        run: |
          if [[ -n "${{ inputs.caller_repo }}" ]]; then
            echo "WORKER_REPO=${{ inputs.worker_repo }}" >> "$GITHUB_ENV"
            echo "SCRIPT_ROOT=_worker" >> "$GITHUB_ENV"
            echo "REPO_ROOT=${{ github.workspace }}" >> "$GITHUB_ENV"
          else
            echo "SCRIPT_ROOT=." >> "$GITHUB_ENV"
            echo "REPO_ROOT=$(pwd)" >> "$GITHUB_ENV"
          fi

      - name: Checkout Worker Scripts
        if: inputs.caller_repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WORKER_REPO }}
          ref: main
          token: ${{ secrets.GH_DEPLOY_TOKEN }}
          path: _worker

      - name: Download vault (artifact v4)
        if: needs.preparation.outputs.vault_transport == 'artifact-v4'
        uses: actions/download-artifact@v4
        with:
          name: vault-and-export
          path: ${{ env.PROJECT }}_tapdata_export

      - name: Download vault (local file)
        if: needs.preparation.outputs.vault_transport == 'local'
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/vault-transport.sh pull
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          VAULT_FILE: ${{ env.PROJECT }}_tapdata_export/vault.json
          PREP_RUNNER: ${{ needs.preparation.outputs.prep_runner }}

      - name: Decrypt vault.json
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/vault-crypto.sh
        env:
          VAULT_FILE: ${{ env.PROJECT }}_tapdata_export/vault.json
          VAULT_ENCRYPTION_KEY: ${{ secrets.VAULT_ENCRYPTION_KEY }}
          CRYPTO_ACTION: decrypt

      - name: Compress Export Files
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/compress-files.sh
        env:
          REPO_ROOT: ${{ env.REPO_ROOT }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: users-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Import Users via TapData API
        id: import_users
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/import-resource.sh users
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: users-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

  # ============================================================
  # Job 3: Preview All Resources（并构建动态 deploy matrix）
  # ============================================================
  preview-all:
    name: Preview All Resources
    runs-on: [self-hosted, tapdata]
    timeout-minutes: 10
    needs: [preparation, deploy-users]
    env:
      PROJECT: ${{ needs.preparation.outputs.project }}
    outputs:
      # 仅供参考/调试：各资源是否有变更
      connections_has_changes: ${{ steps.preview_connections.outputs.has_changes }}
      migrate_tasks_has_changes: ${{ steps.preview_migrate_tasks.outputs.has_changes }}
      sync_tasks_has_changes: ${{ steps.preview_sync_tasks.outputs.has_changes }}
      apis_has_changes: ${{ steps.preview_apis.outputs.has_changes }}
      # 核心：动态 matrix（只含有变更的资源）+ 是否存在任何变更
      deploy_matrix: ${{ steps.build_matrix.outputs.deploy_matrix }}
      has_any_changes: ${{ steps.build_matrix.outputs.has_any_changes }}
    steps:
      - name: Checkout Data Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.caller_repo != '' && inputs.caller_repo || github.repository }}
          ref: ${{ inputs.caller_repo != '' && inputs.caller_sha || env.DEPLOY_REF }}
          token: ${{ secrets.GH_DEPLOY_TOKEN }}

      - name: Set Runtime Paths
        run: |
          if [[ -n "${{ inputs.caller_repo }}" ]]; then
            echo "WORKER_REPO=${{ inputs.worker_repo }}" >> "$GITHUB_ENV"
            echo "SCRIPT_ROOT=_worker" >> "$GITHUB_ENV"
            echo "REPO_ROOT=${{ github.workspace }}" >> "$GITHUB_ENV"
          else
            echo "SCRIPT_ROOT=." >> "$GITHUB_ENV"
            echo "REPO_ROOT=$(pwd)" >> "$GITHUB_ENV"
          fi

      - name: Checkout Worker Scripts
        if: inputs.caller_repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WORKER_REPO }}
          ref: main
          token: ${{ secrets.GH_DEPLOY_TOKEN }}
          path: _worker

      - name: Download vault (artifact v4)
        if: needs.preparation.outputs.vault_transport == 'artifact-v4'
        uses: actions/download-artifact@v4
        with:
          name: vault-and-export
          path: ${{ env.PROJECT }}_tapdata_export

      - name: Download vault (local file)
        if: needs.preparation.outputs.vault_transport == 'local'
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/vault-transport.sh pull
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          VAULT_FILE: ${{ env.PROJECT }}_tapdata_export/vault.json
          PREP_RUNNER: ${{ needs.preparation.outputs.prep_runner }}

      - name: Decrypt vault.json
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/vault-crypto.sh
        env:
          VAULT_FILE: ${{ env.PROJECT }}_tapdata_export/vault.json
          VAULT_ENCRYPTION_KEY: ${{ secrets.VAULT_ENCRYPTION_KEY }}
          CRYPTO_ACTION: decrypt

      - name: Compress Connections Export Files
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/compress-files.sh
        env:
          REPO_ROOT: ${{ env.REPO_ROOT }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: connections-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Preview Connections
        id: preview_connections
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/preview-resource.sh connections
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: connections-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

      - name: Compress Tasks Export Files
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/compress-files.sh
        env:
          REPO_ROOT: ${{ env.REPO_ROOT }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Preview Migrate Tasks
        id: preview_migrate_tasks
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/preview-resource.sh migrate/tasks
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

      - name: Preview Sync Tasks
        id: preview_sync_tasks
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/preview-resource.sh sync/tasks
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

      - name: Compress APIs Export Files
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/compress-files.sh
        env:
          REPO_ROOT: ${{ env.REPO_ROOT }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: apis-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Preview APIs
        id: preview_apis
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/preview-resource.sh apis
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: apis-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

      # 核心新增步骤：根据各 preview 的 has_changes，按固定部署顺序
      # （connections → FDM → MDM → APIs）拼出只含"有变更资源"的 matrix。
      # 输出：
      #   deploy_matrix   = {"include":[ {key,label,archive,import_arg}, ... ]}
      #   has_any_changes = true | false
      # 空数组也输出为合法 JSON，配合下游 deploy job 的 if 守卫，避免空 matrix 报错。
      - name: Build Deploy Matrix
        id: build_matrix
        run: |
          set -euo pipefail
          INCLUDE='[]'
          N=0
          # order 字段：按 add 调用顺序（= 真实执行顺序）递增编号。仅用于 GitHub 运行图
          # 的显示排序——GitHub 把 matrix 腿按 job 名称字母序排列，给名字加数字前缀后，
          # 字母序即等于 max-parallel:1 的执行序（connections→FDM→MDM→APIs）。
          add() {
            N=$((N+1))
            INCLUDE=$(jq -c --argjson e "$1" --arg o "$N" '. + [($e + {order: $o})]' <<<"$INCLUDE")
          }

          if [[ "${{ steps.preview_connections.outputs.has_changes }}" == "true" ]]; then
            add '{"key":"connections","label":"Connections","archive":"connections-export.tar","import_arg":"connections"}'
          fi
          if [[ "${{ steps.preview_migrate_tasks.outputs.has_changes }}" == "true" ]]; then
            add '{"key":"migrate-tasks","label":"Data Replication(FDM)","archive":"tasks-export.tar","import_arg":"migrate/tasks"}'
          fi
          if [[ "${{ steps.preview_sync_tasks.outputs.has_changes }}" == "true" ]]; then
            add '{"key":"sync-tasks","label":"Data Transformation(MDM)","archive":"tasks-export.tar","import_arg":"sync/tasks"}'
          fi
          if [[ "${{ steps.preview_apis.outputs.has_changes }}" == "true" ]]; then
            add '{"key":"apis","label":"APIs","archive":"apis-export.tar","import_arg":"apis"}'
          fi

          COUNT=$(jq 'length' <<<"$INCLUDE")
          MATRIX=$(jq -c -n --argjson inc "$INCLUDE" '{include: $inc}')

          if [[ "$COUNT" -eq 0 ]]; then
            echo "has_any_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_any_changes=true" >> "$GITHUB_OUTPUT"
          fi
          echo "deploy_matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

          echo "=== Build Deploy Matrix ==="
          echo "Changed resources: ${COUNT}"
          echo "deploy_matrix=${MATRIX}"

      # 把"本次将部署 / 跳过"的清单写到 run 的 Summary 页，进一步降低误解。
      - name: Write Deploy Plan Summary
        run: |
          {
            echo "## 部署计划（本次实际执行）"
            echo ""
            echo "| 资源 | 状态 |"
            echo "| --- | --- |"
            echo "| Connections | $([[ '${{ steps.preview_connections.outputs.has_changes }}' == 'true' ]] && echo '✅ 将部署' || echo '— 无变更，跳过') |"
            echo "| Data Replication(FDM) | $([[ '${{ steps.preview_migrate_tasks.outputs.has_changes }}' == 'true' ]] && echo '✅ 将部署' || echo '— 无变更，跳过') |"
            echo "| Data Transformation(MDM) | $([[ '${{ steps.preview_sync_tasks.outputs.has_changes }}' == 'true' ]] && echo '✅ 将部署' || echo '— 无变更，跳过') |"
            echo "| APIs | $([[ '${{ steps.preview_apis.outputs.has_changes }}' == 'true' ]] && echo '✅ 将部署' || echo '— 无变更，跳过') |"
            echo ""
            echo "> 运行图中只会出现\"将部署\"的资源；无变更的资源不再以灰色\"已跳过\"显示。"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # Job 4: Deploy（统一动态 matrix，替代原 connections/FDM/MDM/APIs 四个 job）
  #   - environment: deploy → 单次人工审批覆盖所有 matrix 腿
  #   - max-parallel: 1 + 按 connections→FDM→MDM→APIs 顺序 → 严格串行
  #   - fail-fast: true → 某腿失败即取消后续腿（等价于原依赖链"出错即停"）
  #   - 只有有变更的资源才会成为 matrix 腿 → 运行图里看不到"已跳过"节点
  # ============================================================
  deploy:
    name: Deploy ${{ matrix.order }}. ${{ matrix.label }}
    runs-on: [self-hosted, tapdata]
    timeout-minutes: 15
    environment: deploy
    needs: [preparation, preview-all]
    if: needs.preview-all.outputs.has_any_changes == 'true'
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix: ${{ fromJSON(needs.preview-all.outputs.deploy_matrix) }}
    env:
      PROJECT: ${{ needs.preparation.outputs.project }}
    steps:
      - name: Checkout Data Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.caller_repo != '' && inputs.caller_repo || github.repository }}
          ref: ${{ inputs.caller_repo != '' && inputs.caller_sha || env.DEPLOY_REF }}
          token: ${{ secrets.GH_DEPLOY_TOKEN }}

      - name: Set Runtime Paths
        run: |
          if [[ -n "${{ inputs.caller_repo }}" ]]; then
            echo "WORKER_REPO=${{ inputs.worker_repo }}" >> "$GITHUB_ENV"
            echo "SCRIPT_ROOT=_worker" >> "$GITHUB_ENV"
            echo "REPO_ROOT=${{ github.workspace }}" >> "$GITHUB_ENV"
          else
            echo "SCRIPT_ROOT=." >> "$GITHUB_ENV"
            echo "REPO_ROOT=$(pwd)" >> "$GITHUB_ENV"
          fi

      - name: Checkout Worker Scripts
        if: inputs.caller_repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WORKER_REPO }}
          ref: main
          token: ${{ secrets.GH_DEPLOY_TOKEN }}
          path: _worker

      - name: Download vault (artifact v4)
        if: needs.preparation.outputs.vault_transport == 'artifact-v4'
        uses: actions/download-artifact@v4
        with:
          name: vault-and-export
          path: ${{ env.PROJECT }}_tapdata_export

      - name: Download vault (local file)
        if: needs.preparation.outputs.vault_transport == 'local'
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/vault-transport.sh pull
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          VAULT_FILE: ${{ env.PROJECT }}_tapdata_export/vault.json
          PREP_RUNNER: ${{ needs.preparation.outputs.prep_runner }}

      - name: Decrypt vault.json
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/vault-crypto.sh
        env:
          VAULT_FILE: ${{ env.PROJECT }}_tapdata_export/vault.json
          VAULT_ENCRYPTION_KEY: ${{ secrets.VAULT_ENCRYPTION_KEY }}
          CRYPTO_ACTION: decrypt

      - name: Compress Export Files
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/compress-files.sh
        env:
          REPO_ROOT: ${{ env.REPO_ROOT }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: ${{ matrix.archive }}
          PROJECT: ${{ env.PROJECT }}

      - name: Import ${{ matrix.label }} via TapData API
        id: import_resource
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/import-resource.sh ${{ matrix.import_arg }}
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: ${{ matrix.archive }}
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

  # ============================================================
  # Job 5: Deploy Group Info（始终收尾）
  # ============================================================
  deploy-group-info:
    name: Deploy Group Info
    runs-on: [self-hosted, tapdata]
    timeout-minutes: 15
    needs: [preparation, preview-all, deploy]
    env:
      PROJECT: ${{ needs.preparation.outputs.project }}
    if: >-
      !cancelled()
      && needs.preparation.result == 'success'
      && needs.preview-all.result == 'success'
      && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped' || needs.deploy.result == 'cancelled')
    outputs:
      changed_groupInfo: ${{ steps.import_group_info.outputs.changed_groupInfo }}
    steps:
      - name: Checkout Data Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.caller_repo != '' && inputs.caller_repo || github.repository }}
          ref: ${{ inputs.caller_repo != '' && inputs.caller_sha || env.DEPLOY_REF }}
          token: ${{ secrets.GH_DEPLOY_TOKEN }}

      - name: Set Runtime Paths
        run: |
          if [[ -n "${{ inputs.caller_repo }}" ]]; then
            echo "WORKER_REPO=${{ inputs.worker_repo }}" >> "$GITHUB_ENV"
            echo "SCRIPT_ROOT=_worker" >> "$GITHUB_ENV"
            echo "REPO_ROOT=${{ github.workspace }}" >> "$GITHUB_ENV"
          else
            echo "SCRIPT_ROOT=." >> "$GITHUB_ENV"
            echo "REPO_ROOT=$(pwd)" >> "$GITHUB_ENV"
          fi

      - name: Checkout Worker Scripts
        if: inputs.caller_repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WORKER_REPO }}
          ref: main
          token: ${{ secrets.GH_DEPLOY_TOKEN }}
          path: _worker

      - name: Download vault (artifact v4)
        if: needs.preparation.outputs.vault_transport == 'artifact-v4'
        uses: actions/download-artifact@v4
        with:
          name: vault-and-export
          path: ${{ env.PROJECT }}_tapdata_export

      - name: Download vault (local file)
        if: needs.preparation.outputs.vault_transport == 'local'
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/vault-transport.sh pull
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          VAULT_FILE: ${{ env.PROJECT }}_tapdata_export/vault.json
          PREP_RUNNER: ${{ needs.preparation.outputs.prep_runner }}

      - name: Decrypt vault.json
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/vault-crypto.sh
        env:
          VAULT_FILE: ${{ env.PROJECT }}_tapdata_export/vault.json
          VAULT_ENCRYPTION_KEY: ${{ secrets.VAULT_ENCRYPTION_KEY }}
          CRYPTO_ACTION: decrypt

      - name: Compress Export Files
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/compress-files.sh
        env:
          REPO_ROOT: ${{ env.REPO_ROOT }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: groupInfo-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Import Group Info via TapData API
        id: import_group_info
        run: bash ${{ env.SCRIPT_ROOT }}/scripts/common/import-resource.sh groupInfo
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: groupInfo-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

  # ============================================================
  # Job 6: Cleanup (always runs — removes vault credentials from runner /tmp)
  # ============================================================
  cleanup:
    name: Cleanup
    runs-on: [self-hosted, tapdata]
    timeout-minutes: 5
    needs:
      - preparation
      - deploy-users
      - preview-all
      - deploy
      - deploy-group-info
    if: always()
    steps:
      - name: Remove deploy temp dir (credentials)
        run: |
          if [[ -n "${DEPLOY_DIR:-}" ]]; then
            rm -rf "${DEPLOY_DIR}"
            echo "Removed ${DEPLOY_DIR}"
          else
            echo "DEPLOY_DIR empty, nothing to clean"
          fi
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
