name: TapData Rollback
run-name: "⏪ Rollback · ${{ inputs.project || vars.PROJECT_NAME || github.event.repository.name }} → ${{ inputs.target_env }} · to ${{ inputs.last_stable_tag }} · by @${{ github.actor }}"

# 并发守卫：与 deploy 共享同一并发组 key（tapdata-deploy-{project}-{env}），使同一
# project + env 的 deploy 与 rollback 互斥——绝不允许回滚与部署同时操作同一 TapData
# 项目组（比两个并发 deploy 更危险：rollback 会 stop+clean+reimport）。前缀刻意与
# deploy caller 一致，不用 tapdata-rollback-，就是为了让两者落进同一个 group 互相排队。
# 不同 project / 不同 env 仍可并行。cancel-in-progress: false → 排队不打断（含等待人工审批期间）。
concurrency:
  group: tapdata-deploy-${{ inputs.project || vars.PROJECT_NAME || github.event.repository.name }}-${{ inputs.target_env }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - sit
          - lpt
          - aat
          - prod
      last_stable_tag:
        description: 'Tag to rollback to (required)'
        required: true
        type: string
      project:
        description: 'Project name (留空则取 vars.PROJECT_NAME，再回落到仓库名)'
        required: false
        type: string
        default: ''

jobs:
  rollback:
    # TODO: Replace {WORKER_REPO} with actual org/repo, e.g. your-org/tapdata-cicd-worker
    uses: "{WORKER_REPO}/.github/workflows/tapdata-rollback.yml@main"
    with:
      project: ${{ inputs.project || vars.PROJECT_NAME || github.event.repository.name }}
      target_env: ${{ inputs.target_env }}
      last_stable_tag: ${{ inputs.last_stable_tag }}
      caller_repo: ${{ github.repository }}
      worker_repo: "{WORKER_REPO}"
    secrets: inherit
