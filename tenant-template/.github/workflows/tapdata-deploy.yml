# TapData Deploy (Matrix) —— 租户端 caller（自动部署主入口，调用 worker 的 matrix 部署）
# ============================================================================
# 这是租户仓库的【主】部署入口：隐藏自动跳过步骤的 matrix 版部署。
# 触发方式（与现有单仓库 caller 一致）：
#   - push 到 main 且改动 *_tapdata_export/** → 自动部署到 dev
#   - 推送 tag → 自动部署到 sit
#   - workflow_dispatch 手动触发 → 部署到所选环境
#
# 部署逻辑是多租户：实际运行 actions 的是本租户仓库，通过 uses: 调用 worker 仓库的
# .github/workflows/tapdata-deploy.yml（固定入口；其内容当前是 matrix 变体，由 worker
# 侧从 .github/deploy/ 选型库提升而来）。worker 作为共享部署引擎被复用。
#
# 重要：旧的 tapdata-deploy.yml caller 已移到 .github/disabled/（自动触发原样保留但
# 不生效）。若日后要把它移回 .github/workflows/ 启用，需先停用本 matrix 版的 push/tags，
# 否则同一次 push/tag 会同时触发新旧两条流水线、部署两遍。
# ============================================================================
name: TapData Deploy (Matrix)
# run-name 打头是本次部署对应的 PR 标题（放最前是因为 Actions 列表从右侧截断，放末尾会先被切掉）：
# dev 部署由 PR 合入 main 触发，push 事件里没有 pull_request 字段，但 squash 合并的 commit 标题就是
# 「PR 标题 (#N)」、merge commit 则是「Merge pull request #N from …」，两种合并方式都足以定位 PR。
# 真·pull_request 事件（若租户日后接上）优先取 pull_request.title。tag / 手动触发没有 PR，回落到
# 字面量 Deploy——🚀 本身已经是 deploy 的标识（rollback 用 ⏪），不靠这个词区分。
run-name: "🚀 ${{ (github.event_name != 'workflow_dispatch' && github.ref_type != 'tag' && (github.event.pull_request.title || github.event.head_commit.message)) || 'Deploy' }} · ${{ inputs.project || vars.PROJECT_NAME || github.event.repository.name }} → ${{ inputs.target_env || (github.ref_type == 'tag' && 'sit' || 'dev') }} · ${{ github.event_name == 'workflow_dispatch' && format('manual by @{0}', github.actor) || (github.ref_type == 'tag' && format('tag {0}', github.ref_name) || format('branch {0}', github.ref_name)) }}"

# 并发守卫：同 project + 同目标 env 的部署串行化，防止并发导入同一 TapData 项目组。
# 不同 project / 不同 env 仍可并行（TapData 服务端保证跨 group 并发导入安全）。
# cancel-in-progress: false → 绝不中断进行中的部署，新触发排队等待（含等待人工审批期间）。
concurrency:
  group: tapdata-deploy-${{ inputs.project || vars.PROJECT_NAME || github.event.repository.name }}-${{ inputs.target_env || (github.ref_type == 'tag' && 'sit' || 'dev') }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - '*_tapdata_export/**'
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - sit
          - lpt
      project:
        description: 'Project name (留空则取 vars.PROJECT_NAME，再回落到仓库名)'
        required: false
        type: string
        default: ''

jobs:
  deploy:
    # TODO: Replace {WORKER_REPO} with actual org/repo, e.g. your-org/tapdata-cicd-worker
    uses: "{WORKER_REPO}/.github/workflows/tapdata-deploy.yml@main"
    with:
      project: ${{ inputs.project || vars.PROJECT_NAME || github.event.repository.name }}
      target_env: ${{ inputs.target_env || '' }}
      caller_repo: ${{ github.repository }}
      caller_sha: ${{ github.sha }}
      caller_event: ${{ github.event_name }}
      caller_ref: ${{ github.ref }}
      worker_repo: "{WORKER_REPO}"
    secrets: inherit
